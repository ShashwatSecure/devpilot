spring:
  application:
    name: backend
  datasource:
    url: ${db-url}
    username: ${db-username}
    password: ${db-password}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[format_sql]": true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  ai:
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY}
        chat:
          model: gemini-2.0-flash
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}

app:
  frontend-url: ${FRONTEND_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  token-encryptor-password: ${TOKEN_ENCRYPTOR_PASSWORD}
  token-encryptor-salt: ${TOKEN_ENCRYPTOR_SALT}
  github:
    api-delay-ms: ${GITHUB_API_DELAY_MS:50}
  indexing:
    chunk-size: ${INDEXING_CHUNK_SIZE:800}
    max-file-bytes: ${INDEXING_MAX_FILE_BYTES:102400}