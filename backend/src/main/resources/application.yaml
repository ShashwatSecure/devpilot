spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      # Temporarily skip JPA schema validation while the agent tables are unused.
      ddl-auto: none
    properties:
      hibernate:
        "[format_sql]": true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 3
    validate-on-migrate: true
  ai:
    model:
      embedding:
        text: google-genai
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY}
        chat:
          model: ${GOOGLE_GENAI_CHAT_MODEL:gemini-3.8-flash}
        embedding:
          api-key: ${GOOGLE_GENAI_API_KEY}
          text:
            dimensions: 3072
            model: gemini-embedding-001
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 3072
        # HNSW does not support the existing 3072-dimensional embedding column.
        index-type: NONE
        distance-type: COSINE_DISTANCE
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}

app:
  frontend-url: http://localhost:3000
  cors:
    allowed-origins: http://localhost:3000
  token-encryptor-password: ${TOKEN_ENCRYPTOR_PASSWORD}
  token-encryptor-salt: ${TOKEN_ENCRYPTOR_SALT}
  github:
    api-delay-ms: ${GITHUB_API_DELAY_MS:50}
  indexing:
    chunk-size: ${INDEXING_CHUNK_SIZE:800}
    max-file-bytes: ${INDEXING_MAX_FILE_BYTES:102400}